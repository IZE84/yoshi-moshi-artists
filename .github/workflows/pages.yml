name: Publish static website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.repository.outputs.enabled }}
    steps:
      - id: repository
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.get(context.repo);
            core.setOutput('enabled', String(data.has_pages));
            if (!data.has_pages) core.notice('GitHub Pages is disabled for this repository. Skipping the optional Pages publication.');
  build:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build && npm run check && node tools/package-pages.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/V1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
