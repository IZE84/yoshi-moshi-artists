name: Build METANET deployment branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metanet-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build production website
        run: npm run build
        env:
          SITE_URL: https://yoshi-moshi.com

      - run: npm run check

      - name: Publish generated site to metanet branch
        run: |
          deploy_dir="$RUNNER_TEMP/metanet"
          git fetch origin metanet
          git worktree add --detach "$deploy_dir" FETCH_HEAD
          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" --work-tree="$GITHUB_WORKSPACE/dist" add --all
          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "Generated website is already up to date."
          else
            git -C "$deploy_dir" commit -m "Deploy ${GITHUB_SHA}"
            git -C "$deploy_dir" push origin HEAD:metanet
          fi
