name: Build METANET deployment branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metanet-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build production website
        run: npm run build
        env:
          SITE_URL: https://yoshi-moshi.com

      - run: npm run check

      - name: Publish generated site to metanet branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy_dir="$RUNNER_TEMP/metanet"
          mkdir -p "$deploy_dir"
          cp -a dist/. "$deploy_dir/"
          cd "$deploy_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b metanet
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin metanet
